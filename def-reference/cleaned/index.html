<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Chat — Cleaned Reference</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Instagram DM UI — Cleaned from prod spaghetti -->
  <div class="ig-shell">
    <header class="ig-header">
      <div class="ig-avatar"><img src="avatar.jpg" alt="User"></div>
      <div class="ig-user-info">
        <strong>username</strong>
        <span>Active now</span>
      </div>
      <nav class="ig-header-actions">
        <button aria-label="Call">📞</button>
        <button aria-label="Video">📹</button>
        <button aria-label="Info">ℹ️</button>
      </nav>
    </header>
    <div class="ig-chat-list">
      <div class="ig-bubble from-them">hey — Instagram style bubble</div>
      <div class="ig-bubble from-you">hey — reply bubble</div>
    </div>
    <div class="ig-input-row">
      <button aria-label="Emoji">😊</button>
      <input placeholder="Message…">
      <button aria-label="Send">Send</button>
    </div>
  </div>
</body>
</html>
